# Automatically generated by `scripts/ci/created-gitlab-checks.js` due to the following issue:
# CHECK https://gitlab.com/groups/gitlab-org/-/epics/8205
{
  "variables": {
    "FF_TIMESTAMPS": true,
    "CACHE_COMPRESSION_FORMAT": "tarzstd",
    "RUST_BACKTRACE": "full"
  },
  "default": {
    "interruptible": true
  },
  "Check commit messages": {
    "image": "archlinux",
    "stage": "test",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just codespell git",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile commits"
    ]
  },
  "Check for issues with dependencies": {
    "image": "archlinux",
    "stage": "test",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just cargo-deny",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile deps"
    ]
  },
  "Build docs": {
    "image": "archlinux",
    "stage": "test",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just rust",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile doc"
    ]
  },
  "Check source code formatting": {
    "image": "archlinux",
    "stage": "test",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just rustup",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile fmt"
    ]
  },
  "Lint the source code and provide a CodeClimate report": {
    "image": "archlinux",
    "stage": "test",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just cargo-sonar rust",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile lints-codeclimate"
    ],
    "artifacts": {
      "reports": {
        "codequality": "codeclimate.json"
      }
    }
  },
  "Check spelling": {
    "image": "archlinux",
    "stage": "test",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just codespell",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile spell"
    ]
  },
  "Run unit tests": {
    "image": "archlinux",
    "stage": "test",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just rust cargo-llvm-cov cargo-nextest rustup",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile test"
    ],
    "coverage": "/Line coverage: ([0-9.]*)%/",
    "artifacts": {
      "when": "always",
      "reports": {
        "junit": "target/nextest/ci/junit.xml",
        "metrics": "target/metrics.txt",
        "coverage_report": {
          "coverage_format": "cobertura",
          "path": "target/coverage.xml"
        }
      }
    }
  }
}
