
generate-checks:
  stage: build
  image: archlinux
  interruptible: true
  script:
    - pacman-key --init
    - pacman -Sy --needed --noconfirm archlinux-keyring
    - pacman -Syu --needed --noconfirm nodejs just
    - node .gitlab/create-gitlab-checks.js > .gitlab-generated.yml
  artifacts:
    paths:
      - .gitlab-generated.yml

run-checks:
  stage: test
  interruptible: true
  needs:
    - generate-checks
  trigger:
    include:
      - artifact: .gitlab-generated.yml
        job: generate-checks
    strategy: depend
