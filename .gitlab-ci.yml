# Automatically generated by `scripts/ci/created-gitlab-checks.js` due to the following issue:
# CHECK https://gitlab.com/groups/gitlab-org/-/epics/8205
{
  "variables": {
    "FF_TIMESTAMPS": true,
    "CACHE_COMPRESSION_FORMAT": "tarzstd",
    "RUST_BACKTRACE": "full",
    "CARGO_INCREMENTAL": 0
  },
  "default": {
    "interruptible": true
  },
  "workflow": {
    "rules": [
      {
        "if": "$CI_PIPELINE_SOURCE == \"merge_request_event\""
      },
      {
        "if": "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      },
      {
        "if": "$CI_COMMIT_TAG =~ /^v\\d/"
      }
    ]
  },
  "Check commit messages": {
    "image": "archlinux",
    "stage": "test",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just codespell git",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile commits"
    ]
  },
  "Create lints report": {
    "image": "archlinux",
    "stage": "deploy",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just cargo-sonar rust",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile create-codeclimate"
    ],
    "when": "always",
    "artifacts": {
      "reports": {
        "codequality": "target/codeclimate.json"
      }
    }
  },
  "Check for issues with dependencies": {
    "image": "archlinux",
    "stage": "test",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just cargo-deny",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile deps"
    ],
    "artifacts": {
      "when": "always",
      "paths": [
        "target/deny"
      ]
    }
  },
  "Build docs": {
    "image": "archlinux",
    "stage": "test",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just rust",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile doc"
    ]
  },
  "Check source code formatting": {
    "image": "archlinux",
    "stage": "test",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just rustup",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile fmt"
    ]
  },
  "Lint the source code": {
    "image": "archlinux",
    "stage": "test",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just rust",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile lints"
    ],
    "artifacts": {
      "when": "always",
      "paths": [
        "target/clippy"
      ]
    }
  },
  "Test before publishing the package": {
    "image": "archlinux",
    "stage": "deploy",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just cargo-edit cargo-semver-checks rust",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile pre-publish"
    ],
    "rules": [
      {
        "if": "$CI_MERGE_REQUEST_TITLE =~ /^Release/"
      }
    ]
  },
  "Publish the package": {
    "image": "archlinux",
    "stage": "deploy",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just cargo-edit rust",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile publish"
    ],
    "rules": [
      {
        "if": "$CI_COMMIT_TAG =~ /^v\\d/"
      }
    ]
  },
  "Lint justfile recipes": {
    "image": "archlinux",
    "stage": "test",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just nodejs shellcheck",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile recipes"
    ]
  },
  "Report on all tests": {
    "image": "archlinux",
    "stage": "test",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just rust cargo-llvm-cov rustup cargo-nextest git jq openssh tangler tree",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile report-test"
    ],
    "coverage": "/Line coverage: ([0-9.]*)%/",
    "artifacts": {
      "when": "always",
      "reports": {
        "junit": "target/nextest/ci/junit.xml",
        "metrics": "target/metrics.txt",
        "coverage_report": {
          "coverage_format": "cobertura",
          "path": "target/coverage.xml"
        }
      }
    }
  },
  "Check spelling": {
    "image": "archlinux",
    "stage": "test",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just codespell",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile spell"
    ]
  },
  "Check for unused dependencies": {
    "image": "archlinux",
    "stage": "test",
    "script": [
      "echo -e \"\\e[0Ksection_start:`date +%s`:deps[collapsed=true]\\r\\e[0KInstalling job dependencies\"",
      "pacman-key --init",
      "pacman -Sy --needed --noconfirm archlinux-keyring",
      "pacman -Syu --needed --noconfirm just cargo-machete cargo-udeps rust",
      "echo -e \"\\e[0Ksection_end:`date +%s`:deps\\r\\e[0K\"",
      "just --justfile .justfile unused-deps"
    ],
    "artifacts": {
      "when": "always",
      "paths": [
        "target/udeps"
      ]
    }
  }
}
