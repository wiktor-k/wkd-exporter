[package]
name = "wkd-exporter"
version = "0.2.2"
edition = "2024"
authors = ["Wiktor Kwapisiewicz <wiktor@metacode.biz>"]
description = "Exports an OpenPGP keyring into an advanced WKD directory structure"
repository = "https://gitlab.archlinux.org/archlinux/wkd-exporter"
license = "MIT OR Apache-2.0"
keywords = ["openpgp", "wkd", "pgp"]
categories = ["command-line-utilities"]
exclude = [".gitlab-ci.yml"]

[[bin]]
name = "wkd-exporter"
required-features = ["cli"]

[[bin]]
name = "gen-manpages"
required-features = ["gen"]

[[bin]]
name = "gen-shell-completions"
required-features = ["gen"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:tracing-subscriber", "dep:hex"]
gen = ["cli", "dep:clap_allgen"]

[dependencies]
clap = { version = "4.5.41", features = ["derive"], optional = true }
email_address = "0.2.9"
pgp = { version = "0.16.0", default-features = false }
sha1 = "0.10.6"
thiserror = "2.0.12"
z-base-32 = "0.1.4"
hex = { version = "0.4.3", optional = true }
tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"], optional = true }
clap_allgen = { version = "0.2.1", optional = true }

[dev-dependencies]
testresult = "0.4.1"
dir-diff = "0.3.3"
rstest = "0.25.0"
tempfile = "3.20.0"
test-log = { version = "0.2.18", features = ["trace"] }

[lints.clippy]
pedantic = "deny"

[lints.rust]
missing_debug_implementations = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
