[package]
name = "wkd-exporter"
version = "0.3.2"
edition.workspace = true
authors = ["Wiktor Kwapisiewicz <wiktor@metacode.biz>"]
description = "Exports an OpenPGP keyring into an advanced WKD directory structure"
repository = "https://gitlab.archlinux.org/archlinux/wkd-exporter"
license = "MIT OR Apache-2.0"
keywords = ["openpgp", "wkd", "pgp"]
categories = ["command-line-utilities"]
exclude = [".gitlab-ci.yml"]

[[bin]]
name = "wkd-exporter"
path = "src/main.rs"
required-features = ["cli"]

[workspace]
members = [".", "xtask"]
resolver = "3"
package.edition = "2024"

[workspace.dependencies]
clap = { version = "4.5.60", features = ["derive"] }

[features]
default = ["cli"]
cli = ["dep:clap", "dep:tracing-subscriber", "dep:tracing_log_error"]
gen = ["dep:enum-values"]

[dependencies]
clap = { workspace = true, optional = true }
email_address = "0.2.9"
enum-values = { version = "0.1.0", optional = true }
pgp = { version = "0.19.0", default-features = false }
sha1 = "0.10.6"
thiserror = "2.0.18"
# rename the z-base-32 package to suppress false positive from cargo-machete
zbase32 = { package = "z-base-32", version = "0.1.4" }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"], optional = true }
tracing_log_error = { version = "0.1.4", optional = true }

[dev-dependencies]
testresult = "0.4.1"
dir-diff = "0.3.3"
rstest = "0.26.1"
tempfile = "3.26.0"
test-log = { version = "0.2.19", features = ["trace"] }

[lints.clippy]
pedantic = "deny"

[lints.rust]
missing_debug_implementations = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
